<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Titulo de la web -->
    <title>Mau Dev Web</title>
    <!-- Importacion de archivo css -->
    <link rel="stylesheet" href="styles.css" />
    <!-- https://boxicons.com/ -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/boxicons@latest/css/boxicons.min.css"
    />
    <!-- https://remixicon.com/ -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <!-- https://fonts.google.com/ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200;300;400;500;600;700;800;900&family=Roboto+Mono:wght@200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Esta seccion es la cabecera de la pagina web -->
    <header>
      <!-- Logo -->
      <a href="#" class="logo">MAU DEV</a>

      <div class="bx bx-menu" id="menu-icon"></div>
      
      <ul class="navlist">
        <li><a href="#">Home</a></li>
        <li><a href="#">Sobre mi</a></li>
        <li><a href="#">Portafolio</a></li>
        <li><a href="#">Contacto</a></li>
      </ul>
    </header>

      <!-- HERO SECTION -->
      <section class="hero">
        <div class="hero-text">
          <h5>Community Manager</h5>
          <h4>Fullstack Developer</h4>
          <h1>Mau Dev</h1>
          <p>
            Pregunta por el desarrollo de tu sitio web y mantenimiento de tus
            redese sociales
          </p>
          <a href="#">CV</a>
          <a href="#" class="linkedin"><i class="ri-linkedin-box-fill" ></i>Conoce mas acerca de mi trabajo.</a>
        </div>

        <div class="hero-img">
            <img src="asssets/imgs/mau-dev-img-redonda.png" alt="mau dev foto">
        </div>

      </section>

      <div class="icons">
        <a href="#"><i class="ri-instagram-line"></i></a>
        <a href="#"><i class="ri-linkedin-fill"></i></a>
        <a href="#"><i class="ri-github-fill"></i></a>
      </div>
    

      <div class="scroll-down">
        <a href="#"><i class="ri-arrow-down-s-fill"></i></a>
      </div>

      <!--  Scroll reveal -->
      <script src="https://unpkg.com/scrollreveal"></script> 

      <script src="script.js"></script>
  </body>
</html>
